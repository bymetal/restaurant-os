x-app-environment: &app-environment
  - NODE_ENV
  - HOST
  - PORT
  - LOG_LEVEL
  - CORS_ORIGINS
  - DATABASE_URL
  - REDIS_URL
  - SESSION_SECRET
  - JWT_SECRET
  - REFRESH_TOKEN_SECRET
  - PASSWORD_RESET_SECRET
  - APP_ENCRYPTION_KEY

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *app-environment
    expose:
      - "4000"
    command:
      - sh
      - -c
      - node packages/db/dist/migrate-cli.js && node apps/api/dist/server.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:4000/health/live').then((r) =>
          process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *app-environment
    command: ["node", "apps/worker/dist/index.js"]
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    command: ["pnpm", "--filter", "@restaurant-os/admin", "start"]
    depends_on:
      api:
        condition: service_healthy

  storefront:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3001"
    command: ["pnpm", "--filter", "@restaurant-os/storefront", "start"]
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    volumes:
      - restaurant-os-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - restaurant-os-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  restaurant-os-postgres:
  restaurant-os-redis:
